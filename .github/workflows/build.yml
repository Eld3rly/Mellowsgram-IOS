name: Mellowsgram iOS simulator IPA

# The artifact is unsigned for the simulator and is intended for local testing.

on:
  push:
    branches: [indev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mellowsgram-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Select Xcode and inspect SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Generate Mellowsgram configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/mellowsgram_configuration.py \
            --output build-input/mellowsgram-configuration.json \
            --api-id "$TELEGRAM_API_ID" \
            --api-hash "$TELEGRAM_API_HASH" \
            --team-id "$APPLE_TEAM_ID" \
            --bundle-id com.mellowsgram.ios \
            --url-scheme mellowsgram

      - name: Prepare Bazel disk cache
        shell: bash
        run: mkdir -p build-input/bazel-disk-cache

      - name: Restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: build-input/bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'versions.json', 'build-system/Make/Make.py', 'submodules/TelegramApi/swift_scheme.tl') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-

      - name: Preflight Mellowsgram Swift targets
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((10000 + $(git rev-list --count HEAD)))
          preflight_targets=(
            //submodules/Postbox:Postbox
            //submodules/TelegramCore:TelegramCore
            //submodules/AccountContext:AccountContext
            //submodules/AccountUtils:AccountUtils
            //submodules/Display:Display
            //submodules/GalleryData:GalleryData
            //submodules/PremiumUI:PremiumUI
            //submodules/SettingsUI:SettingsUI
            //submodules/TelegramUI:TelegramUI
            //submodules/TelegramUI/Components/ButtonComponent:ButtonComponent
            //submodules/TelegramUI/Components/Chat/ChatHistoryEntry:ChatHistoryEntry
            //submodules/TelegramUI/Components/Chat/ChatMessageAnimatedStickerItemNode:ChatMessageAnimatedStickerItemNode
            //submodules/TelegramUI/Components/Chat/ChatMessageAttachedContentNode:ChatMessageAttachedContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageBubbleItemNode:ChatMessageBubbleItemNode
            //submodules/TelegramUI/Components/Chat/ChatMessageContactBubbleContentNode:ChatMessageContactBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode:ChatMessageDateAndStatusNode
            //submodules/TelegramUI/Components/Chat/ChatMessageFactCheckBubbleContentNode:ChatMessageFactCheckBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageGiveawayBubbleContentNode:ChatMessageGiveawayBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageInteractiveFileNode:ChatMessageInteractiveFileNode
            //submodules/TelegramUI/Components/Chat/ChatMessageInteractiveInstantVideoNode:ChatMessageInteractiveInstantVideoNode
            //submodules/TelegramUI/Components/Chat/ChatMessageInteractiveMediaNode:ChatMessageInteractiveMediaNode
            //submodules/TelegramUI/Components/Chat/ChatMessageItem:ChatMessageItem
            //submodules/TelegramUI/Components/Chat/ChatMessageItemImpl:ChatMessageItemImpl
            //submodules/TelegramUI/Components/Chat/ChatMessageItemView:ChatMessageItemView
            //submodules/TelegramUI/Components/Chat/ChatMessageMapBubbleContentNode:ChatMessageMapBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessagePollBubbleContentNode:ChatMessagePollBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageReplyInfoNode:ChatMessageReplyInfoNode
            //submodules/TelegramUI/Components/Chat/ChatMessageRestrictedBubbleContentNode:ChatMessageRestrictedBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageRichDataBubbleContentNode:ChatMessageRichDataBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageSelectionInputPanelNode:ChatMessageSelectionInputPanelNode
            //submodules/TelegramUI/Components/Chat/ChatMessageStickerItemNode:ChatMessageStickerItemNode
            //submodules/TelegramUI/Components/Chat/ChatMessageTextBubbleContentNode:ChatMessageTextBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageTodoBubbleContentNode:ChatMessageTodoBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ChatMessageWidgetBubbleContentNode:ChatMessageWidgetBubbleContentNode
            //submodules/TelegramUI/Components/Chat/ReplyAccessoryPanelNode:ReplyAccessoryPanelNode
            //submodules/TelegramUI/Components/ChatMediaEditorScreen:ChatMediaEditorScreen
            //submodules/TelegramUI/Components/MediaManager/PeerMessagesMediaPlaylist:PeerMessagesMediaPlaylist
            //submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen:PeerInfoScreen
          )
          for target in "${preflight_targets[@]}"; do
            echo "Preflight target: $target"
            python3 -u build-system/Make/Make.py \
              --overrideXcodeVersion \
              --cacheDir build-input/bazel-disk-cache \
              build \
              --configurationPath build-input/mellowsgram-configuration.json \
              --xcodeManagedCodesigning \
              --buildNumber "$build_number" \
              --configuration debug_sim_arm64 \
              --disableProvisioningProfiles \
              --target "$target" \
              --continueOnError
          done

      - name: Build simulator IPA
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((10000 + $(git rev-list --count HEAD)))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir build-input/bazel-disk-cache \
            build \
            --configurationPath build-input/mellowsgram-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber "$build_number" \
            --configuration debug_sim_arm64 \
            --disableProvisioningProfiles \
            --outputBuildArtifactsPath build/mellowsgram-simulator-artifacts

      - name: Verify simulator IPA
        shell: bash
        run: |
          set -euo pipefail
          test -s build/mellowsgram-simulator-artifacts/Telegram.ipa
          unzip -l build/mellowsgram-simulator-artifacts/Telegram.ipa | head -40
          shasum -a 256 build/mellowsgram-simulator-artifacts/Telegram.ipa

      - name: Upload simulator IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellowsgram-iOS-simulator-IPA-${{ env.BUILD_NUMBER }}
          path: build/mellowsgram-simulator-artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 7
