name: Mellowsgram iOS simulator IPA

# The artifact is unsigned for the simulator and is intended for local testing.

on:
  push:
    branches: [indev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mellowsgram-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Select Xcode and inspect SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Generate Mellowsgram configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/mellowsgram_configuration.py \
            --output build-input/mellowsgram-configuration.json \
            --api-id "$TELEGRAM_API_ID" \
            --api-hash "$TELEGRAM_API_HASH" \
            --team-id "$APPLE_TEAM_ID" \
            --bundle-id com.mellowsgram.ios \
            --url-scheme mellowsgram

      - name: Prepare Bazel disk cache
        shell: bash
        run: mkdir -p build-input/bazel-disk-cache

      - name: Restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: build-input/bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'versions.json', 'build-system/Make/Make.py', 'Telegram/BUILD', 'submodules/TelegramApi/swift_scheme.tl') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-

      - name: Fast preflight (no build)
        shell: bash
        run: |
          set -euo pipefail
          git show --check --format= HEAD
          python3 -m py_compile ci/mellowsgram_configuration.py
          python3 build-system/Make/PostboxImportCheck.py
          swiftc_path="$(xcrun --find swiftc)"
          for source in \
            submodules/AccountContext/Sources/FetchMediaUtils.swift \
            submodules/Postbox/Sources/MellowsgramMessageArchiveVisibility.swift \
            submodules/TelegramUI/Sources/ChatHistoryEntriesForView.swift \
            submodules/TelegramUI/Components/Chat/ChatMessageAttachedContentNode/Sources/ChatMessageAttachedContentNode.swift \
            submodules/TelegramUI/Components/Chat/ChatMessageInteractiveMediaNode/Sources/ChatMessageInteractiveMediaNode.swift \
            submodules/TelegramUI/Components/Chat/ChatMessageReplyInfoNode/Sources/ChatMessageReplyInfoNode.swift \
            submodules/TelegramUI/Components/Chat/ReplyAccessoryPanelNode/Sources/ReplyAccessoryPanelNode.swift \
            submodules/TelegramUI/Sources/ChatControllerForwardMessages.swift \
            submodules/TelegramUI/Sources/MellowsgramBarkNotificationManager.swift \
            submodules/TelegramUIPreferences/Sources/MellowsgramBarkCredentialStore.swift \
            submodules/TelegramUI/Sources/SharedWakeupManager.swift \
            submodules/TelegramUI/Sources/AppDelegate.swift \
            submodules/TelegramUI/Sources/ChatController.swift \
            submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderNode.swift \
            submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreenOpenStories.swift \
            submodules/TelegramUI/Components/Stories/StoryContainerScreen/Sources/OpenStories.swift \
            submodules/TranslateUI/Sources/Translate.swift \
            submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift \
            submodules/SettingsUI/Sources/Themes/ThemeSettingsAppIconItem.swift \
            submodules/SettingsUI/Sources/MellowsgramSettingsController.swift \
            submodules/TelegramCore/Sources/Settings/MellowsgramSettings.swift \
            submodules/TelegramUIPreferences/Sources/MellowsgramGlobalSettings.swift; do
            echo "Parsing $source"
            "$swiftc_path" -frontend -parse -parse-as-library "$source"
          done

      - name: Build simulator IPA
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((10000 + $(git rev-list --count HEAD)))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir build-input/bazel-disk-cache \
            build \
            --configurationPath build-input/mellowsgram-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber "$build_number" \
            --configuration debug_sim_arm64 \
            --continueOnError \
            --disableProvisioningProfiles \
            --outputBuildArtifactsPath build/mellowsgram-simulator-artifacts

      - name: Verify simulator IPA
        shell: bash
        run: |
          set -euo pipefail
          test -s build/mellowsgram-simulator-artifacts/Telegram.ipa
          unzip -l build/mellowsgram-simulator-artifacts/Telegram.ipa | head -40
          shasum -a 256 build/mellowsgram-simulator-artifacts/Telegram.ipa

      - name: Upload simulator IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellowsgram-iOS-simulator-IPA-${{ env.BUILD_NUMBER }}
          path: build/mellowsgram-simulator-artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 7
